[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setcommit-repro"
version = "1.0.0"
description = "SETCOMMIT: training-free coordinated token commitments for masked diffusion language models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["setcommit*", "dacs_repro*"]
